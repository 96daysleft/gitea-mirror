apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: gitea-mirror-sync
  namespace: argo
spec:
  schedule: "0 */8 * * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: sync
    templates:
      - name: sync
        templateRef:
          name: gitea-mirror
          template: sync

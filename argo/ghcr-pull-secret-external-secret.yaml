apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ print .username ":" .token | b64enc }}"}}}'
  data:
  - secretKey: token
    remoteRef:
      key: gitea-mirror
      property: github_token
  - secretKey: username
    remoteRef:
      key: gitea-mirror
      property: github_username

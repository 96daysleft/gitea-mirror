apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-pem
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-vault
    kind: ClusterSecretStore
  target:
    name: github-app-pem
    creationPolicy: Owner
  data:
  - secretKey: key
    remoteRef:
      key: gitea-mirror
      property: private-key

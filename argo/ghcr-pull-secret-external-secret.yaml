apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: argo
spec:
  refreshInterval: "30m"
  secretStoreRef:
    name: openbao-vault
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths":{
              "ghcr.io":{
                "username":"jerky676",
                "password":"{{ .token }}",
                "auth":"{{ printf "token:%s" .token | b64enc }}"
              }
            }
          }
  data:
  - secretKey: token
    remoteRef:
      key: gitea-mirror
      property: github-pull-token

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-mirror-secrets
  namespace: argo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-vault
    kind: ClusterSecretStore
  target:
    name: gitea-mirror-secrets
    creationPolicy: Owner
  data:
  - secretKey: github_pull_token
    remoteRef:
      key: gitea-mirror
      property: github-pull-token
  - secretKey: gitea_token
    remoteRef:
      key: gitea-mirror
      property: gitea-token